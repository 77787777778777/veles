# deploy/vps/veles-user-manager.conf — a drop-in for the user managers
# of veles, veles-sbx and veles-signer
# (/etc/systemd/system/user@<uid>.service.d/veles.conf, setup.sh).
#
# Their containers start with their user manager (linger), at boot.
[Unit]
# The firewall table first: without it a sandbox leaves from the owner's
# address and the gateway reaches every local service. If the table is
# missing, the manager — and every container under it — stays down
# (ExecStartPre) rather than start unconfined. Not Requires=: that would
# restart every container whenever setup.sh reloads the table.
After=veles-nft.service
Wants=veles-nft.service
# wg0, because the gateway and the signer publish on 10.0.30.1, which
# wg-quick@wg0 brings up after network-online.target. Ordering only:
# without wg0 they still start, fail the bind, and Restart= retries.
After=wg-quick@wg0.service

[Service]
ExecStartPre=+/usr/sbin/nft list table inet veles
