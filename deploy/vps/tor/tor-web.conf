# deploy/vps/tor/tor-web.conf —
# /etc/systemd/system/tor@velesweb.service.d/veles.conf (setup.sh).
# Its SOCKS port is on wg0's address (torrc-web), so it starts after wg0,
# and a bind that fails anyway (wg0 slow to come up) is retried.
[Unit]
After=wg-quick@wg0.service
Wants=wg-quick@wg0.service

[Service]
Restart=on-failure
RestartSec=10
