# deploy/vps/tmpfiles-veles.conf → /etc/tmpfiles.d/veles.conf
#
# The sandbox user's podman socket lives here. The directory is the
# gate: its group is `veles`, the gateway's primary group, which stays
# mapped inside the gateway's keep-id container, so the gateway can
# reach the socket and no other user can.
d /run/veles-sbx 0750 veles-sbx veles -
