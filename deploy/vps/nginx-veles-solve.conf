# deploy/vps/nginx-veles-solve.conf
# /etc/nginx/sites-available/veles-solve — the public half of the bot
# challenge relay (PLAN-challenge-relay.md, D1, 2026-10-11).
#
# A challenge link sent to IRC or Telegram names
# https://solve.veles.7778777.online/challenge/<token> (VELES_CHALLENGE_URL
# in the gateway's .env). The page lives on the gateway's desktop API
# (127.0.0.1:8642), and ONLY its routes are passed: the page, its picture,
# its state and its answer. The token is the page's only credential and
# lives as long as its relay. Every other path is a 404 here, so nothing
# else of the API is reachable from outside.
#
# DNS: the grey-cloud wildcard *.veles.7778777.online already points here.
# TLS: the wildcard certificate of nginx-veles.conf (certbot DNS-01) covers
# this name. An exact server_name wins over that vhost's wildcard.

server {
    listen 80;
    listen [::]:80;
    server_name solve.veles.7778777.online;
    include snippets/letsencrypt.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name solve.veles.7778777.online;

    ssl_certificate     /etc/letsencrypt/live/veles.7778777.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veles.7778777.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/veles.7778777.online/chain.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # An answer is a click or a few typed characters.
    client_max_body_size 16k;

    location ~ ^/challenge/[0-9a-f]+(/(shot|state|answer))?$ {
        proxy_pass http://127.0.0.1:8642;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / { return 404; }
}
