# deploy/atproto/nginx-veles.conf
# /etc/nginx/sites-available/veles — TLS front for the vlpds island.
# veles.7778777.online serves the PDS; *.veles.7778777.online resolves the
# per-account handles (https://<handle>/.well-known/atproto-did).
# DNS is grey-cloud (Cloudflare proxy off): the proxy caps uploads at
# 100 MB and kills the firehose websocket. Cert: certbot DNS-01 wildcard
# (/etc/letsencrypt/live/veles.7778777.online/).

server {
    listen 80;
    listen [::]:80;
    server_name veles.7778777.online *.veles.7778777.online;
    # ACME HTTP-01 stays reachable for renewals; everything else goes TLS.
    include snippets/letsencrypt.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name veles.7778777.online *.veles.7778777.online;

    ssl_certificate     /etc/letsencrypt/live/veles.7778777.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veles.7778777.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/veles.7778777.online/chain.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The PDS carries repo blobs; the firehose websocket needs long-lived,
    # unbuffered streaming. Generous body size, no request buffering on the
    # websocket path.
    client_max_body_size 50m;

    # Operator-only surfaces never leave the box: the admin console, the
    # admin XRPC, metrics/pprof, and node-to-node /internal/*. They are
    # reachable over the tailnet/loopback only, never here.
    location ~ ^/(admin|metrics|internal)(/|$) { return 404; }
    location ~ ^/xrpc/vlpds\.admin\. { return 404; }

    # The firehose + appview websocket: upgrade headers, no buffering,
    # long timeouts so the stream is not cut idle.
    location /xrpc/com.atproto.sync.subscribeRepos {
        proxy_pass http://127.0.0.1:2583;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:2583;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
