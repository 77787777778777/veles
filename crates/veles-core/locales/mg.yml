# GENERATED by scripts/i18n-tsv2yml.sh from a translator's TSV.
# Keys match the desktop catalogs (msgs/<id>.msg) so one
# translation pass feeds both surfaces. A key missing here
# falls back to the English text. Read at runtime by
# crates/veles-core/src/i18n.rs — not compiled into the binary.
