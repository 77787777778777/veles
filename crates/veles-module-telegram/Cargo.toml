[package]
name = "veles-module-telegram"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Telegram platform as an in-process module (PLAN-plugins-installer.md R6): the dylib the module host loads, over the veles-telegram library."

[lib]
# The module, and only the module (crates/veles-module-irc says why a
# module is a dylib-only crate of its own over a plain rlib).
crate-type = ["dylib"]

[dependencies]
veles-telegram = { path = "../veles-telegram" }
veles-runtime = { path = "../veles-runtime" }
