[package]
name = "veles-module-slopdrop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The slopdrop bridge as an in-process module (PLAN-plugins-installer.md R5): the dylib the module host loads, over the veles-slopdrop library."

[lib]
# The module, and only the module (crates/veles-module-irc says why a
# module is a dylib-only crate of its own over a plain rlib).
crate-type = ["dylib"]

[dependencies]
veles-slopdrop = { path = "../veles-slopdrop" }
veles-runtime = { path = "../veles-runtime" }
