[package]
name = "veles-lang-racket"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Racket language host (PLAN-plugins-installer.md R9): Racket CS 9.3 embedded through libracketcs on one engine thread with a mailbox, a namespace and a custodian per script; the library behind the lang-racket module."
build = "build.rs"

[dependencies]
veles-runtime = { path = "../veles-runtime" }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
