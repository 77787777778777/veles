[package]
name = "veles-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Write a veles process plugin: the handshake, the dispatch loop, --describe, and a typed client for the gateway."

# veles-types and runtime crates only — never veles-core (veles-types'
# Cargo.toml says why). A plugin built on this is a plain Rust binary.
[dependencies]
veles-types = { path = "../veles-types" }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
